<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- no zoom (owner's wish): iOS ignores user-scalable=no, so game/input.js also cancels every touch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05070d">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Hole: fly through dark space, dodge meteors, sink deeper. One hit ends the run.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hole">
  <title>Hole</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./game/style.css">
  <script type="importmap">
    { "imports": { "three": "./game/vendor/three.module.js", "three/addons/": "./game/vendor/addons/" } }
  </script>
</head>
<body data-mode="loading">
  <canvas id="view"></canvas>
  <div id="vignette"></div>
  <div id="lean-edge"></div>
  <div id="edge"></div>

  <div id="hud">
    <div id="cross"></div>
    <div id="circle"></div>
    <div id="timer">00:00.0</div>
    <div id="pad-left" class="pad" aria-hidden="true">
      <div id="btn-left" class="btn"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></div>
      <div id="btn-right" class="btn"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></div>
    </div>
    <div id="pad-right" class="pad" aria-hidden="true">
      <div id="btn-up" class="btn"><svg viewBox="0 0 24 24"><path d="m5 15 7-7 7 7"/></svg></div>
      <div id="btn-down" class="btn"><svg viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></svg></div>
    </div>
  </div>

  <section id="loading" class="screen shown">
    <div class="small-title">Hole</div>
    <div id="bar"><div></div></div>
    <p id="load-error"></p>
  </section>

  <section id="start" class="screen">
    <h1>Hole</h1>
    <p id="start-prompt" class="prompt">Tap to start</p>
    <button class="fs" type="button" hidden>
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span>Fullscreen</span>
    </button>
    <p id="a2hs" class="hint" hidden>Fullscreen on iPhone: Share, then Add to Home Screen</p>
    <p id="start-hint" class="hint"></p>
    <p id="start-best" class="best"></p>
    <button class="gear" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M19.07 9.81 L21.80 10.01 L21.80 13.99 L19.07 14.19 L18.55 15.45 L20.33 17.53 L17.53 20.33 L15.45 18.55 L14.19 19.07 L13.99 21.80 L10.01 21.80 L9.81 19.07 L8.55 18.55 L6.47 20.33 L3.67 17.53 L5.45 15.45 L4.93 14.19 L2.20 13.99 L2.20 10.01 L4.93 9.81 L5.45 8.55 L3.67 6.47 L6.47 3.67 L8.55 5.45 L9.81 4.93 L10.01 2.20 L13.99 2.20 L14.19 4.93 L15.45 5.45 L17.53 3.67 L20.33 6.47 L18.55 8.55Z"/><circle cx="12" cy="12" r="3.1"/></svg>
    </button>
  </section>

  <section id="over" class="screen">
    <p class="label">You lasted</p>
    <div id="over-time" class="time">00:00.0</div>
    <p id="over-best" class="best"></p>
    <p id="over-prompt" class="prompt">Tap to fly again</p>
    <button class="fs" type="button" hidden>
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span>Fullscreen</span>
    </button>
    <button class="gear" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M19.07 9.81 L21.80 10.01 L21.80 13.99 L19.07 14.19 L18.55 15.45 L20.33 17.53 L17.53 20.33 L15.45 18.55 L14.19 19.07 L13.99 21.80 L10.01 21.80 L9.81 19.07 L8.55 18.55 L6.47 20.33 L3.67 17.53 L5.45 15.45 L4.93 14.19 L2.20 13.99 L2.20 10.01 L4.93 9.81 L5.45 8.55 L3.67 6.47 L6.47 3.67 L8.55 5.45 L9.81 4.93 L10.01 2.20 L13.99 2.20 L14.19 4.93 L15.45 5.45 L17.53 3.67 L20.33 6.47 L18.55 8.55Z"/><circle cx="12" cy="12" r="3.1"/></svg>
    </button>
  </section>

  <section id="settings" aria-label="Settings" hidden>
    <div class="card">
      <h2>Settings</h2>
      <div class="row"><span>Music</span>
        <div class="stepper" data-key="music"><button type="button" data-d="-1" aria-label="Music quieter">&minus;</button><output>80%</output><button type="button" data-d="1" aria-label="Music louder">+</button></div>
      </div>
      <div class="row"><span>Sounds</span>
        <div class="stepper" data-key="sound"><button type="button" data-d="-1" aria-label="Sounds quieter">&minus;</button><output>80%</output><button type="button" data-d="1" aria-label="Sounds louder">+</button></div>
      </div>
      <div class="row"><span>Debug info</span>
        <button type="button" class="toggle" data-key="debug" aria-pressed="false">Off</button>
      </div>
      <button type="button" class="done">Done</button>
    </div>
  </section>

  <noscript><p class="noscript">Hole needs JavaScript and WebGL.</p></noscript>
  <script type="module" src="./game/main.js"></script>
</body>
</html>
